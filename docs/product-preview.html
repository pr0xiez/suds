    .date-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.date-tab{background:white;border:1px solid var(--line);padding:9px 17px;border-radius:10px;color:var(--muted);font-size:12px;text-align:left}.date-tab strong{display:block;font-size:15px;color:var(--ink);margin-top:2px}.date-tab.active{background:#174e3f;color:#d8e9cf;border-color:#174e3f}.date-tab.active strong{color:white}.schedule-block{border-left:4px solid var(--green);background:#edf5e9;padding:18px;border-radius:9px;display:flex;gap:18px;align-items:center;margin:12px 0}.schedule-block.break{background:#f2f3ef;border-color:#afbaa9;color:var(--muted)}.schedule-block.pending{background:#fff8e8;border-color:#d9ad56}

bel.field{display:grid;gap:6px;font-size:12px;font-weight:650}input,select{min-width:0;width:100%;border:1px solid #d6ded1;background:#fff;border-radius:8px;padding:10px 12px;color:var(--ink)}textarea{max-width:100%}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 12px 14px}.table td{padding:17px 12px;border-top:1px solid #edf0e9}.table-wrap{overflow-x:auto}.table td small{display:block;color:var(--muted)}
    .customer-wrap{max-width:1050px;margin:0 auto;padding:24px}.customer-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}.customer-brand{font-size:20px;font-weight:750;letter-spacing:-.7px}.customer-brand .sub{font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted)}.customer-nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:30px}.customer-nav button{border:0;background:transparent;padding:13px 17px;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:650}.customer-nav button.active{border-color:var(--green);color:var(--green)}.booking-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}.booking-head{margin-bottom:24px}.booking-head h1{font-size:30px}.booking-head p{margin-top:9px}.service-option{width:100%;background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px;text-align:left;display:flex;gap:13px;align-items:center;color:var(--ink);margin-top:10px}.service-option.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:#f5faf1}.service-option p{font-size:12px;color:var(--muted);margin-top:4px}.service-option .price{font-size:18px;font-weight:750;margin-left:auto}.radio{height:17px;width:17px;border:1px solid #abbba3;border-radius:50%;flex-shrink:0}.active .radio{border:5px solid var(--green);background:white}.step-heading{font-size:14px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}.step-number{font-size:11px;height:23px;width:23px;display:grid;place-items:center;background:#e4ecdb;border-radius:50%;color:#55713f}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 5px;color:var(--ink);font-size:12px}.slot.active{background:var(--green);color:#fff;border-color:var(--green)}.summary{position:sticky;top:24px;align-self:start}.summary h3{margin-bottom:17px}.summary-line{padding:12px 0;border-bottom:1px solid #edf0e9;display:flex;justify-content:space-between;font-size:12px;gap:12px}.summary .info{margin:18px 0}.business-badge{background:#edf4e5;border:1px solid #d3dfc9;border-radius:11px;padding:15px;margin-bottom:20px}.business-badge strong{font-size:14px}.success-icon{display:grid;place-items:center;width:55px;height:55px;border-radius:50%;background:#d9edcf;color:#54753e;font-size:25px;margin-bottom:18px}.success{max-width:590px;margin:30px auto}.success h1{font-size:31px}.success p{margin:15px 0}.mobile-notice{font-size:11px;color:var(--muted);margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#153c35;color:#fff;padding:13px 20px;border-radius:10px;box-shadow:0 6px 25px #16372930;font-size:13px;z-index:20;max-width:calc(100% - 32px);text-align:center}.preview-foot{padding:18px 24px;text-align:center;font-size:11px;color:var(--muted)}
    .campaign-art svg{display:block;width:100%;max-width:220px;margin:14px auto 0}.assistant-context,.saved-item{overflow-wrap:anywhere}.saved-item>div{min-width:0}.saved-item .btn{flex-shrink:0}
    @media(min-width:1200px){main.owner-main{padding:42px 52px}}
    @media(max-width:920px){.owner-layout{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:25px 13px}main.owner-main{padding:28px 23px}.two-col,.marketing-grid{grid-template-columns:1fr}.hero-art{display:none}.booking-layout{grid-template-columns:minmax(0,1fr) 245px}.customer-wrap{padding:20px}.page-head{align-items:start}}
    @media(max-width:640px){.preview-bar{padding:12px 16px;gap:8px}.preview-switch{width:100%}.preview-switch button{flex:1}.owner-layout{display:block}.sidebar{padding:15px 16px;gap:15px}.sidebar .brand{font-size:23px}.shop-name,.sidebar-foot{display:none}.sidebar nav{display:flex;overflow-x:auto;gap:4px}.nav-btn{padding:9px 12px;white-space:nowrap;font-size:12px}.nav-icon{display:none}main.owner-main{padding:25px 16px}.page-head{flex-wrap:wrap;gap:15px;margin-bottom:20px}.hero{padding:21px}.hero h2{font-size:21px}.stats{gap:8px}.stats .card{padding:13px 10px}.big{font-size:25px}.stat-label{font-size:10px;min-height:28px}.stat-note{font-size:10px}.card{padding:18px}.form-grid{grid-template-columns:1fr}.customer-wrap{padding:20px 16px}.customer-head{align-items:start}.customer-brand{font-size:17px}.customer-nav{gap:0}.customer-nav button{padding:12px 10px}.booking-layout{display:flex;flex-direction:column}.summary{position:static;width:100%}.slots{grid-template-columns:repeat(3,1fr)}.date-tab{padding:8px 12px}.appointment{gap:8px}.appointment-content h3{font-size:13px}.appointment>.pill{font-size:9px;padding:4px 7px}.hero-actions .btn{font-size:12px}.schedule-block{padding:14px;gap:12px}.time{width:54px;font-size:12px}.full{grid-column:auto}.preview-foot{padding:16px}}

<body>
  <header class="preview-bar">
    <span><strong>Suds product preview</strong> · Fictional data, no real bookings or messages</span>
    <div class="preview-switch" role="group" aria-label="Preview experience">
      <button type="button" data-view="owner" class="active" aria-pressed="true">Business owner</button>
      <button type="button" data-view="customer" aria-pressed="false">Customer</button>
    </div>
    <a href="product-plan.md">Read the product plan ↗</a>
  </header>
  <div id="app"></div>
  <footer class="preview-foot">Interactive concept only · Changes last until you reload · No account, database, delivery, or social connection</footer>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    const state = {
      view: 'owner', ownerTab: 'today', customerTab: 'book', day: 0, service: 'full', slot: null,
      businessName: 'Ridge Detail Co.', businessType: 'mobile', approval: false, buffer: 30,
      bookingDone: null, campaign: 'job', requests: [], savedCampaigns: [],
      shortDemo: { source: 'photos', style: 'clean', approved: false, ready: false, frame: 'before' },
      marketingTasks: {
        job: { jobId: 'sample-3', highlight: 'Interior reset and exterior refresh.', approved: false, platform: 'Instagram', tone: 'friendly', caption: '', result: null, status: 'empty' },
        slots: { service: 'full', day: 0, slot: null, platform: 'Instagram', tone: 'friendly', caption: '', result: null, status: 'empty' },
        intro: { area: 'Cincinnati', specialty: 'Interior and exterior detailing, with an easy online booking experience.', platform: 'Instagram', tone: 'friendly', caption: '', result: null, status: 'empty' },
      },
      customer: { name: 'Maya Reed', email: 'maya@example.com', vehicle: '2021 Honda CR-V' },
      jobs: [
        { id: 'sample-1', day: 0, start: 540, duration: 60, service: 'exterior', customer: 'Evan Cole', vehicle: '2020 Toyota Tacoma', status: 'scheduled' },
        { id: 'sample-2', day: 1, start: 570, duration: 90, service: 'interior', customer: 'Maya Reed', vehicle: '2021 Honda CR-V', status: 'scheduled' },
        { id: 'sample-3', day: -1, start: 780, duration: 150, service: 'full', customer: 'Evan Cole', vehicle: '2020 Toyota Tacoma', status: 'completed' },
      ],
    }
    const services = [
      { id: 'exterior', name: 'Exterior refresh', description: 'Hand wash, wheels, windows, and a protective finish.', price: 65, duration: 60 },
      { id: 'interior', name: 'Interior reset', description: 'Vacuum, surfaces, mats, and interior glass.', price: 110, duration: 90 },
      { id: 'full', name: 'Full detail', description: 'A complete interior reset and exterior refresh.', price: 165, duration: 150 },
    ]
    const dates = Array.from({ length: 4 }, (_, i) => {
      const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + 2 + i); return d
    })
    const app = document.getElementById('app')
    const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
    const time = m => `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2,'0')} ${m >= 720 ? 'PM' : 'AM'}`
    const dayText = i => dates[i].toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
    const serviceById = id => services.find(s => s.id === id)
    const money = n => `$${n}`
    const carArt = clean => `<svg viewBox="0 0 220 110" fill="none" aria-hidden="true"><ellipse cx="111" cy="90" rx="91" ry="8" fill="#153c3515"/><path d="M29 70 42 41c3-7 9-10 18-10h92c8 0 15 4 19 11l16 28" fill="${clean ? '#417b60' : '#798174'}"/><path d="m63 39-16 25h117l-15-25Z" fill="#c9e1cf"/><path d="M26 66h168v20H26z" fill="${clean ? '#285741' : '#666e62'}"/><path d="M22 67h178v13H22z" fill="${clean ? '#417b60' : '#929989'}"/><circle cx="55" cy="85" r="15" fill="#243b31"/><circle cx="168" cy="85" r="15" fill="#243b31"/><circle cx="55" cy="85" r="7" fill="#b0c7a4"/><circle cx="168" cy="85" r="7" fill="#b0c7a4"/>${clean ? '<path d="m177 15 3-9 3 9 9 3-9 3-3 9-3-9-9-3Z" fill="#fcfff8"/>' : '<circle cx="121" cy="75" r="3" fill="#b7ae94"/><circle cx="80" cy="71" r="2" fill="#b7ae94"/>'}</svg>`
    const brand = () => `<div class="brand"><span class="brand-mark" aria-hidden="true">◌</span>suds<span style="color:#d7f1a6">.</span></div>`
    const btn = (label, action, extra = '') => `<button type="button" class="btn ${extra}" data-action="${action}">${label}</button>`
    function notify(message) {
      const el = document.getElementById('toast'); el.textContent = message; el.classList.remove('hidden')
      clearTimeout(notify.timer); notify.timer = setTimeout(() => el.classList.add('hidden'), 4200)
    }
    function available(day, serviceId) {
      const service = serviceById(serviceId), length = service.duration + state.buffer
      const occupied = state.jobs.filter(j => j.day === day && j.status === 'scheduled').map(j => [j.start, j.start + j.duration + state.buffer])
      occupied.push([720,750])
      const result = []
      for(let start = 540; start + length <= 1020; start += 30) {
        if(!occupied.some(([a,b]) => start < b && start + length > a)) result.push(start)
      }
      return result
    }
    function datesMarkup() {
      return `<div class="date-tabs">${dates.map((d,i) => `<button type="button" class="date-tab ${state.day === i ? 'active' : ''}" data-day="${i}" aria-pressed="${state.day === i}">${d.toLocaleDateString('en-US',{ weekday:'short' })}<strong>${d.toLocaleDateString('en-US',{ month:'short',day:'numeric' })}</strong></button>`).join('')}</div>`
    }
    function appointment(job) {
      const s = serviceById(job.service)
      return `<div class="appointment"><div class="time">${time(job.start)}</div><div class="appointment-content"><h3>${esc(job.customer)}</h3><p>${esc(job.vehicle)} · ${esc(s.name)}</p></div><span class="pill green">${money(s.price)}</span></div>`
    }
    function requestMarkup(r) {
      return `<div class="request"><div class="row between wrap"><h3>${esc(r.customer)}</h3><span class="pill amber">Needs approval</span></div><p class="muted"><small>${esc(r.vehicle)} · ${esc(serviceById(r.service).name)}</small></p><p><small>${dayText(r.day)} at ${time(r.start)}</small></p><div class="row">${btn('Accept request',`accept:${r.id}`,'primary small')}${btn('Decline',`decline:${r.id}`,'small ghost')}</div></div>`
    }
    function today() {
      const jobs = state.jobs.filter(j => j.day === 0 && j.status === 'scheduled')
      const pending = state.requests.filter(r => r.status === 'requested')

    function prepareCampaign() {
      const task = activeTask(), error = briefError(task)
      if(error) { notify(error); return false }
      const link = 'https://suds.example/ridge-detail'
      const cta = state.approval ? 'Request your appointment' : 'Book your appointment'
      const finishSentence = text => /[.!?]$/.test(text.trim()) ? text.trim() : `${text.trim()}.`
      const hooks = {
        job: { friendly: 'A fresh start for your ride.', professional: 'A closer look at our latest detail.', upbeat: 'Fresh ride, fresh start ✨' },
        slots: { friendly: 'A little time for your car this week.', professional: 'An appointment is available.', upbeat: 'Your next fresh start is waiting ✨' },
        intro: { friendly: 'Good to meet you.', professional: 'Introducing your local detailing business.', upbeat: 'Say hello to a fresh start ✨' },
      }
      let body, facts, format, nextStep
      if(state.campaign === 'job') {
        const job = completedJob(task), service = serviceById(job.service)
        body = `${job.vehicle} · ${service.name}\n${finishSentence(task.highlight)}\n\nSee our services at ${state.businessName}.`
        facts = [`${job.vehicle} · completed ${service.name}`, 'Before/after photos approved by you', `Your highlight: ${task.highlight.trim()}`]
        format = task.platform === 'Instagram' ? 'Before/after carousel' : 'Before/after photo post'
        nextStep = `Use the approved before and after photos in that order. Copy your caption and keep the booking link in your post${task.platform === 'Instagram' ? ' and bio.' : '.'}`
      } else if(state.campaign === 'slots') {
        const service = serviceById(task.service)
        body = `${state.businessName} has an opening for a ${service.name.toLowerCase()} on ${dayText(task.day)} at ${time(task.slot)}.\n${money(service.price)} · ${service.duration} minutes.`
        facts = [`${service.name} · ${money(service.price)}`, `${dayText(task.day)} at ${time(task.slot)} is available now`, `Service duration and ${state.buffer}-minute buffer checked`]
        format = 'Availability card + caption'
        nextStep = 'Share the opening with your booking link. Check the time again before posting, and update or remove the post once it fills.'
      } else {
        body = `Meet ${state.businessName}. ${state.businessType === 'mobile' ? 'We bring the detail to you in' : 'We offer detailing for drivers in'} ${task.area.trim()}.\n${finishSentence(task.specialty)}\n\nSee our services and choose a time online.`

    function owner() {
      const items = [['today','Today','◧'],['schedule','Schedule','▦'],['customers','Customers','◎'],['marketing','Marketing','✧'],['business','Business','⚙']]
      const selectedTab = state.ownerTab === 'shorts' ? 'marketing' : state.ownerTab
      const pages = { today, schedule, customers, marketing, business, shorts: shortsDemo }
      return `<div class="owner-layout"><aside class="sidebar"><div>${brand()}<p class="shop-name">${esc(state.businessName)}</p></div><nav aria-label="Business navigation">${items.map(([id,label,icon])=>`<button type="button" class="nav-btn ${selectedTab===id?'active':''}" data-owner-tab="${id}" ${selectedTab===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('')}</nav><div class="sidebar-foot"><div class="row"><span class="avatar">JR</span><div><strong>Jordan Ridge</strong><p>Business owner</p></div></div><p style="margin-top:16px">One small step. One more customer.</p></div></aside><main class="owner-main">${pages[state.ownerTab]()}</main></div>`
    }
    function booking() {
      if(state.bookingDone) return confirmation()
      const service = serviceById(state.service), slots = available(state.day,state.service)
      if(state.slot !== null && !slots.includes(state.slot)) state.slot = null
      return `<div class="booking-head"><p class="eyebrow muted">${state.businessType === 'mobile' ? 'Mobile detailing · Cincinnati area' : 'Detailing at our Cincinnati location'}</p><h1 style="margin-top:9px">A fresh start for your car.</h1><p class="muted">Choose a service and a time that works for you.</p></div><div class="booking-layout"><form id="booking-form"><div class="business-badge"><strong>${esc(state.businessName)}</strong><p class="muted"><small>${state.businessType === 'mobile' ? 'We come to your home or workplace.' : 'Bring your vehicle to our detailing location.'} Prices below are fictional examples.</small></p></div><h2 class="step-heading"><span class="step-number">1</span>Choose your service</h2>${services.map(s=>`<button type="button" class="service-option ${s.id===state.service?'active':''}" data-service="${s.id}" aria-pressed="${s.id===state.service}"><span class="radio" aria-hidden="true"></span><div><h3>${s.name}</h3><p>${s.description}</p><p>${s.duration} minutes</p></div><span class="price">${money(s.price)}</span></button>`).join('')}<h2 class="step-heading"><span class="step-number">2</span>Your vehicle and visit</h2><div class="form-grid"><label class="field">Vehicle<select name="vehicle"><option>2021 Honda CR-V</option></select></label>${state.businessType === 'mobile' ? '<label class="field">Appointment address<input name="address" required value="42 Example Lane, Cincinnati" autocomplete="off"></label>' : '<div class="info">Visit our example location. The real booking page shows the business address.</div>'}</div><h2 class="step-heading"><span class="step-number">3</span>Choose an available time</h2>${datesMarkup()}<div class="slots">${slots.map(m=>`<button type="button" class="slot ${m===state.slot?'active':''}" data-slot="${m}" aria-pressed="${m===state.slot}">${time(m)}</button>`).join('') || '<p class="muted full">No times for this service. Choose another day.</p>'}</div><p class="mobile-notice">Times shown in America/New_York. Appointment duration: ${service.duration} minutes.</p><h2 class="step-heading"><span class="step-number">4</span>Your contact details</h2><div class="form-grid"><label class="field">Name<input name="name" value="Maya Reed" readonly></label><label class="field">Email<input type="email" name="email" value="maya@example.com" readonly></label></div><p class="mobile-notice">This concept uses Maya’s fictional customer account. Account verification is part of the production plan.</p></form><aside class="card summary"><h3>Your appointment</h3><div class="summary-line"><span class="muted">Service</span><strong>${service.name}</strong></div><div class="summary-line"><span class="muted">Vehicle</span><strong>Honda CR-V</strong></div><div class="summary-line"><span class="muted">Day</span><strong>${dayText(state.day)}</strong></div><div class="summary-line"><span class="muted">Time</span><strong>${state.slot===null?'Choose a time':time(state.slot)}</strong></div><div class="summary-line"><span class="muted">Total</span><strong style="font-size:22px">${money(service.price)}</strong></div><p class="info">${state.approval ? 'The detailer will review your request. Your appointment is confirmed after they accept it.' : 'Your appointment will be confirmed immediately if the time is still available.'}</p><button type="submit" form="booking-form" class="btn primary wide" ${state.slot===null?'disabled':''}>${state.approval?'Request appointment':'Confirm appointment'}</button><p class="mobile-notice">No payment collected in this preview.</p></aside></div>`
    }
    function confirmation() {
      const r = state.requests.find(r=>r.id===state.bookingDone)
      const title = r.status === 'accepted' ? 'You’re booked.' : r.status === 'requested' ? 'Your request is in.' : r.status === 'declined' ? 'Your request was declined.' : 'Your appointment was canceled.'
      return `<section class="card success"><div class="success-icon">✓</div><h1>${title}</h1><p class="muted">${r.status==='requested' ? `${esc(state.businessName)} will review your chosen time. You can check the status in your appointments.` : r.status==='accepted' ? 'Your appointment appears in your customer portal and on the detailer’s schedule.' : 'Choose another available time when you are ready.'}</p><div class="info"><strong>${esc(serviceById(r.service).name)}</strong><p style="margin:5px 0 0">${dayText(r.day)} at ${time(r.start)} · ${esc(r.vehicle)}</p></div><div class="row wrap gap">${btn('My appointments','portal','primary')}${btn('Book another detail','new-booking')}${btn('See owner view','owner-preview','ghost small')}</div></section>`
    }
    function portal() {
      const pending = state.requests.filter(r=>r.customer==='Maya Reed' && r.status==='requested')
      const jobs = state.jobs.filter(j=>j.customer==='Maya Reed' && j.status==='scheduled').sort((a,b)=>a.day-b.day||a.start-b.start)
      return `<div class="page-head"><div><p class="eyebrow muted">Your customer portal</p><h1 style="margin-top:9px">Hi, Maya.</h1><p class="muted">Your car, your appointments, and an easy way to book again.</p></div>${btn('Book a detail','new-booking','primary')}</div><div class="two-col"><section class="card"><div class="card-head"><h2>Your appointments</h2><span class="pill green">${jobs.length} confirmed</span></div>${pending.map(r=>`<div class="request"><div class="row between wrap"><h3>${esc(serviceById(r.service).name)}</h3><span class="pill amber">Awaiting approval</span></div><p><small>${dayText(r.day)} at ${time(r.start)}</small></p><p class="muted"><small>We’ll show a confirmation here when the detailer accepts.</small></p></div>`).join('')}${jobs.map(j=>`<div class="appointment"><div class="appointment-content"><h3>${esc(serviceById(j.service).name)}</h3><p>${dayText(j.day)} at ${time(j.start)}</p><p>${esc(j.vehicle)} · ${money(serviceById(j.service).price)}</p><div class="row wrap" style="margin-top:9px"><span class="pill green">Confirmed</span>${btn('Cancel appointment',`cancel:${j.id}`,'ghost small danger')}</div></div></div>`).join('') || '<p class="empty">You have no confirmed appointments yet.</p>'}</section><section class="card"><h2>Your vehicle</h2><div style="max-width:220px;margin:18px auto">${carArt(true)}</div><h3>2021 Honda CR-V</h3><p class="muted"><small>Saved for quicker booking next time.</small></p>${btn('Book for this vehicle','new-booking','wide gap')}<p class="info gap">Your detailer’s private notes and other customers’ information aren’t part of your portal.</p></section></div>`
    }
    function vehicles() {
      return `<div class="booking-head"><h1>Your vehicles</h1><p class="muted">A little less to enter the next time you book.</p></div><section class="card" style="max-width:520px"><div style="max-width:250px;margin:20px auto">${carArt(true)}</div><h2>2021 Honda CR-V</h2><p class="muted gap">Maya’s saved vehicle in this preview.</p>${btn('Book a detail for this car','new-booking','primary gap')}<p class="mobile-notice">Add and edit vehicles are included in the product plan.</p></section>`
    }
    function customer() {
      const pages={ book:booking, appointments:portal, vehicles }
      return `<div class="customer-wrap"><header class="customer-head"><div class="row"><span class="brand-mark" aria-hidden="true">◌</span><div class="customer-brand">${esc(state.businessName)}<p class="sub">Customer booking · powered by Suds</p></div></div><div class="row"><span class="avatar">MR</span><span><small>Maya</small></span></div></header><nav class="customer-nav" aria-label="Customer navigation">${[['book','Book a detail'],['appointments','My appointments'],['vehicles','My vehicles']].map(([id,label])=>`<button type="button" class="${state.customerTab===id?'active':''}" data-customer-tab="${id}" ${state.customerTab===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav><main>${pages[state.customerTab]()}</main></div>`
    }
    function render() {
      app.innerHTML = state.view==='owner' ? owner() : customer()
      history.replaceState(null, '', `#/${state.view}/${state.view==='owner' ? state.ownerTab : state.customerTab}`)
      document.querySelectorAll('[data-view]').forEach(button=>{
        const active=button.dataset.view===state.view; button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))
      })
    }
    document.addEventListener('click', async event => {
      const el=event.target.closest('button'); if(!el || el.disabled || el.type === 'submit') return
      if(el.dataset.view) state.view=el.dataset.view
      else if(el.dataset.ownerTab) state.ownerTab=el.dataset.ownerTab
      else if(el.dataset.customerTab) {state.customerTab=el.dataset.customerTab;if(state.customerTab==='book')state.bookingDone=null}
      else if(el.dataset.day !== undefined) {state.day=Number(el.dataset.day);state.slot=null}
      else if(el.dataset.service) {state.service=el.dataset.service;state.slot=null}
      else if(el.dataset.slot) state.slot=Number(el.dataset.slot)
      else if(el.dataset.campaign) state.campaign=el.dataset.campaign
      else if(el.dataset.action) {
        const [action,id]=el.dataset.action.split(':')
        if(action==='public') {state.view='customer';state.customerTab='book';state.bookingDone=null;state.slot=null}
        else if(action==='portal') {state.view='customer';state.customerTab='appointments'}
        else if(action==='owner-preview') {state.view='owner';state.ownerTab='today'}
        else if(action==='new-booking') {state.view='customer';state.customerTab='book';state.bookingDone=null;state.slot=null}
        else if(action==='marketing'||action==='schedule'||action==='shorts') state.ownerTab=action
        else if(action==='short-source') {state.shortDemo.source=id;state.shortDemo.ready=false}
        else if(action==='short-frame') state.shortDemo.frame=id
        else if(action==='accept') {
          const request=state.requests.find(r=>r.id===id)
          if(request?.status!=='requested') return
          if(!available(request.day,request.service).includes(request.start)) {notify('That time is no longer available. The request is still pending.');return}
          request.status='accepted';state.jobs.push({...request,duration:serviceById(request.service).duration,status:'scheduled'})
          notify('Appointment confirmed. Check Maya’s customer portal to see the same update.')
        } else if(action==='decline') {const r=state.requests.find(r=>r.id===id);if(r)r.status='declined';notify('Request declined in this preview. No message sent.')}
        else if(action==='cancel') {const j=state.jobs.find(j=>j.id===id);if(j)j.status='canceled';const r=state.requests.find(r=>r.id===id);if(r)r.status='canceled';notify('Demo appointment canceled. Its time is available again.')}
        else if(action==='save-draft') saveDraft()
        else if(action==='open-draft') {
          const saved=state.savedCampaigns.find(item=>item.campaign===id)
          if(saved){state.campaign=id;state.marketingTasks[id]=structuredClone(saved.task)}
        }
        else if(action==='copy-caption') {
          const task=activeTask();if(!draftReady(task))return
          try{await navigator.clipboard.writeText(task.caption);notify('Caption copied. Publish it from your social account.')}catch{document.getElementById('caption').select();notify('Caption selected. Use your browser’s Copy command.')}
          return
        } else if(action==='download-caption') {
          const task=activeTask();if(!draftReady(task))return
          const blob=new Blob([task.caption],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a')
          a.href=url;a.download='suds-example-caption.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Example caption downloaded.');return
        } else if(action==='published') {
          const task=activeTask(),saved=state.savedCampaigns.find(item=>item.campaign===state.campaign)
          if(!draftReady(task)||task.status!=='saved'||!saved)return
          task.status='posted';saved.status='posted';saved.task.status='posted';notify('Marked as posted in this preview. Nothing was sent to a social network.')
        }
      } else return
      render()
    })
    document.addEventListener('input',event=>{
      const el=event.target
      if(el.id==='caption') {
        const task=activeTask();task.caption=el.value;task.status='edited'
        document.getElementById('draft-status').textContent='Edited draft'
        document.querySelectorAll('[data-action="save-draft"],[data-action="copy-caption"],[data-action="download-caption"]').forEach(button=>{button.disabled=!draftReady(task)})
        document.querySelector('[data-action="published"]').disabled=true
      } else if(el.dataset.brief && el.tagName==='INPUT' && el.type!=='checkbox') {
        activeTask()[el.dataset.brief]=el.value;refreshMarketingDraft()
      }
    })
    document.addEventListener('change',event=>{
      const el=event.target,field=el.dataset.brief
      if(el.dataset.short) {state.shortDemo[el.dataset.short]=el.type==='checkbox'?el.checked:el.value;state.shortDemo.ready=false;render();return}
      if(!field || (el.tagName!=='SELECT' && el.type!=='checkbox')) return
      const task=activeTask()
      task[field]=el.type==='checkbox'?el.checked:field==='day'||field==='slot'?(el.value===''?null:Number(el.value)):el.value
      if(field==='day'||field==='service')task.slot=null
      if(field==='day'||field==='service') {
        const focusId=el.id;render();document.getElementById(focusId)?.focus()
      } else refreshMarketingDraft()
    })
    document.addEventListener('submit',event=>{
      event.preventDefault()
      if(event.target.id==='business-form') {
        const data=new FormData(event.target)
        state.businessName=String(data.get('businessName')).trim()||'Ridge Detail Co.';state.businessType=String(data.get('businessType'));state.approval=data.get('confirmation')==='approval';state.buffer=Number(data.get('buffer'));state.slot=null;notify('Preview settings saved. Try the customer booking view.')
      } else if(event.target.id==='shorts-demo-form') {
        if(!state.shortDemo.approved)return
        state.shortDemo.ready=true
        notify('Sample storyboard prepared. This preview does not render a real video.')
      } else if(event.target.id==='marketing-form') {
        if(!prepareCampaign())return
        render()
        document.getElementById('caption').focus({preventScroll:true})
        document.getElementById('marketing-draft').scrollIntoView({behavior:'smooth',block:'start'})
        return
      } else if(event.target.id==='booking-form') {
        if(state.slot===null||!available(state.day,state.service).includes(state.slot)){notify('Choose an available time.');render();return}
        const id=`demo-${Date.now()}-${state.requests.length}`
        const request={id,day:state.day,start:state.slot,service:state.service,customer:'Maya Reed',vehicle:'2021 Honda CR-V',status:state.approval?'requested':'accepted'}
        state.requests.push(request)
        if(!state.approval)state.jobs.push({...request,duration:serviceById(state.service).duration,status:'scheduled'})
        state.bookingDone=id
      } else return
      render()
    })
    function readDemoRoute() {
      const [view, tab] = location.hash.replace(/^#\/?/, '').split('/')
      if(view === 'owner') {
        state.view = 'owner'
        if(['today','schedule','customers','marketing','business','shorts'].includes(tab)) state.ownerTab = tab
      } else if(view === 'customer') {
        state.view = 'customer'
        if(['book','appointments','vehicles'].includes(tab)) state.customerTab = tab
      }
    }
    window.addEventListener('hashchange', () => { readDemoRoute(); render() })
    readDemoRoute()
    render()
  </script>
</body>
</html>
